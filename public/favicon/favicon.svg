<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <rect width="512" height="512" rx="100" fill="#1a56db"/>
  <!-- Circle of colorful hands using simplified path shapes -->
  <!-- Top hand - pink/magenta -->
  <g transform="translate(256,256)">
    <!-- Top: magenta -->
    <ellipse cx="0" cy="-110" rx="28" ry="52" fill="#e83e8c" transform="rotate(0)"/>
    <ellipse cx="0" cy="-110" rx="14" ry="26" fill="#e83e8c" transform="rotate(0) translate(22,-14)"/>
    <ellipse cx="0" cy="-110" rx="14" ry="26" fill="#e83e8c" transform="rotate(0) translate(-22,-14)"/>
  </g>
  <!-- Simplified colorful circle of hands as arcs -->
  <!-- Using colored wedge/petal shapes instead -->

  <!-- 6 colored "hand" petals arranged in a circle -->
  <!-- Blue (right) -->
  <path d="M256,256 L340,180 Q380,140 370,100 Q360,60 310,80 L256,256 Z" fill="#1e88e5" transform="rotate(0, 256, 256)"/>
  <!-- Orange -->
  <path d="M256,256 L340,180 Q380,140 370,100 Q360,60 310,80 L256,256 Z" fill="#fb8c00" transform="rotate(60, 256, 256)"/>
  <!-- Magenta/Pink -->
  <path d="M256,256 L340,180 Q380,140 370,100 Q360,60 310,80 L256,256 Z" fill="#e91e8c" transform="rotate(120, 256, 256)"/>
  <!-- Purple -->
  <path d="M256,256 L340,180 Q380,140 370,100 Q360,60 310,80 L256,256 Z" fill="#8e24aa" transform="rotate(180, 256, 256)"/>
  <!-- Green -->
  <path d="M256,256 L340,180 Q380,140 370,100 Q360,60 310,80 L256,256 Z" fill="#43a047" transform="rotate(240, 256, 256)"/>
  <!-- Red -->
  <path d="M256,256 L340,180 Q380,140 370,100 Q360,60 310,80 L256,256 Z" fill="#e53935" transform="rotate(300, 256, 256)"/>

  <!-- Center white circle to give clean look -->
  <circle cx="256" cy="256" r="55" fill="#1a56db"/>
  <!-- Letter P for Pintando -->
  <text x="256" y="276" font-family="Arial Black, sans-serif" font-size="72" font-weight="900" fill="white" text-anchor="middle">P</text>
</svg>
